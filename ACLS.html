<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ACLS</title>
<style>
:root {
  --red:      #D93025; --red-lt:    #FEF2F1; --red-md:   #FCCAC7; --red-dk:   #6B1511;
  --amber:    #C07000; --amber-lt:  #FFF8EC; --amber-md: #FDDFA0; --amber-dk: #5C3400;
  --teal:     #0B7B5E; --teal-lt:   #EDFAF5; --teal-md:  #A8EDD8; --teal-dk:  #064535;
  --green:    #2E7D32; --green-lt:  #F1F8E9; --green-md: #B5DBA8; --green-dk: #133815;
  --purple:   #5B4FD9; --purple-lt: #F0EEFF; --purple-md:#C5BFFA; --purple-dk:#28206B;
  --slate:    #546E7A; --slate-lt:  #ECEFF1; --slate-md: #B0BEC5; --slate-dk: #263238;
  --ink:      #1A1A2E;
  --ink2:     #4A4A6A;
  --ink3:     #8888AA;
  --surface:  #F5F5FA;
  --card:     #FFFFFF;
  --line:     #E8E8F0;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--surface);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;overscroll-behavior:none}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(245,245,250,0.92);
  backdrop-filter:saturate(200%) blur(24px);
  -webkit-backdrop-filter:saturate(200%) blur(24px);
  border-bottom:0.5px solid var(--line);
  padding:calc(var(--safe-t) + 8px) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.topbar-badge{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(145deg,#D93025,#5B4FD9);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.topbar-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-0.3px}
.topbar-sub{font-size:11px;color:var(--ink3);margin-top:1px}

/* ── SCROLL ── */
.scroll-wrap{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 10px calc(var(--safe-b) + 20px)}
.svg-wrap{max-width:700px;margin:0 auto;width:100%}
svg{display:block;width:100%;height:auto;touch-action:pan-x pan-y}

/* ── SVG NODES ── */
.node{cursor:pointer}
.node rect{stroke-width:1.3;transition:opacity .12s}
.node:active rect{opacity:.75}

.c-red    rect{fill:var(--red-lt);   stroke:var(--red)}
.c-amber  rect{fill:var(--amber-lt); stroke:var(--amber)}
.c-teal   rect{fill:var(--teal-lt);  stroke:var(--teal)}
.c-green  rect{fill:var(--green-lt); stroke:var(--green)}
.c-purple rect{fill:var(--purple-lt);stroke:var(--purple)}
.c-slate  rect{fill:var(--slate-lt); stroke:var(--slate)}

/* legend squares */
.sq-red   {fill:var(--red-lt);   stroke:var(--red);   stroke-width:1.2}
.sq-amber {fill:var(--amber-lt); stroke:var(--amber); stroke-width:1.2}
.sq-teal  {fill:var(--teal-lt);  stroke:var(--teal);  stroke-width:1.2}
.sq-green {fill:var(--green-lt); stroke:var(--green); stroke-width:1.2}
.sq-purple{fill:var(--purple-lt);stroke:var(--purple);stroke-width:1.2}

.th{font-family:-apple-system,'SF Pro Text',sans-serif;font-size:12.5px;font-weight:700}
.ts{font-family:-apple-system,'SF Pro Text',sans-serif;font-size:9.5px;fill:var(--ink2)}
.tl{font-family:-apple-system,'SF Pro Text',sans-serif;font-size:9px;fill:var(--ink3)}

.c-red    .th{fill:var(--red-dk)}
.c-amber  .th{fill:var(--amber-dk)}
.c-teal   .th{fill:var(--teal-dk)}
.c-green  .th{fill:var(--green-dk)}
.c-purple .th{fill:var(--purple-dk)}
.c-slate  .th{fill:var(--slate-dk)}

/* ── BOTTOM SHEET ── */
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,10,30,.5);z-index:200;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.backdrop.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:201;
  background:var(--card);border-radius:22px 22px 0 0;
  max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.72,0,1);
  padding-bottom:var(--safe-b);
}
.sheet.open{transform:translateY(0)}
.handle{width:40px;height:4px;border-radius:2px;background:#DDDDE8;margin:10px auto 0;flex-shrink:0}

.sheet-head{
  padding:12px 16px 10px;border-bottom:0.5px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;gap:8px
}
.sheet-title{font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;flex:1}
.sheet-x{
  width:30px;height:30px;border-radius:50%;background:#EFEFF5;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);flex-shrink:0
}

.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}

/* ── SHEET CONTENT COMPONENTS ── */
.s-section{margin:14px 0 0}
.s-label{
  font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:6px
}
.s-box{
  background:var(--surface);border-radius:12px;padding:12px 14px;
  border:0.5px solid var(--line);margin-bottom:8px
}
.s-box p{font-size:13.5px;color:var(--ink2);line-height:1.65;margin:0}
.s-box p+p{margin-top:6px}
.s-box strong{color:var(--ink);font-weight:600}

.s-steps{list-style:none;padding:0;margin:0}
.s-steps li{
  display:flex;gap:10px;padding:8px 0;
  border-bottom:0.5px solid var(--line);font-size:13.5px;color:var(--ink2);line-height:1.6
}
.s-steps li:last-child{border-bottom:none}
.s-steps li .num{
  min-width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px
}
.step-red   .num{background:var(--red-md);   color:var(--red-dk)}
.step-amber .num{background:var(--amber-md); color:var(--amber-dk)}
.step-teal  .num{background:var(--teal-md);  color:var(--teal-dk)}
.step-green .num{background:var(--green-md); color:var(--green-dk)}
.step-purple.num{background:var(--purple-md);color:var(--purple-dk)}

.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.s-card{
  background:var(--surface);border-radius:10px;padding:10px 12px;
  border:0.5px solid var(--line)
}
.s-card .s-card-label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.s-card .s-card-val{font-size:13px;font-weight:600;color:var(--ink)}
.s-card .s-card-sub{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.4}

.badge{
  display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;margin:2px 2px 2px 0;white-space:nowrap
}
.badge-red   {background:var(--red-lt);   color:var(--red-dk);   border:0.5px solid var(--red-md)}
.badge-amber {background:var(--amber-lt); color:var(--amber-dk); border:0.5px solid var(--amber-md)}
.badge-teal  {background:var(--teal-lt);  color:var(--teal-dk);  border:0.5px solid var(--teal-md)}
.badge-green {background:var(--green-lt); color:var(--green-dk); border:0.5px solid var(--green-md)}
.badge-slate {background:var(--slate-lt); color:var(--slate-dk); border:0.5px solid var(--slate-md)}

.warn{
  background:#FFF8EC;border:0.5px solid #FDDFA0;border-radius:10px;
  padding:10px 12px;font-size:13px;color:#5C3400;line-height:1.6;margin-bottom:8px
}
.warn strong{font-weight:700}
.danger{
  background:#FEF2F1;border:0.5px solid #FCCAC7;border-radius:10px;
  padding:10px 12px;font-size:13px;color:#6B1511;line-height:1.6;margin-bottom:8px
}
.danger strong{font-weight:700}
.ok{
  background:var(--teal-lt);border:0.5px solid var(--teal-md);border-radius:10px;
  padding:10px 12px;font-size:13px;color:var(--teal-dk);line-height:1.6;margin-bottom:8px
}

.drug-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 0;border-bottom:0.5px solid var(--line);gap:8px
}
.drug-row:last-child{border-bottom:none}
.drug-name{font-size:13.5px;font-weight:600;color:var(--ink)}
.drug-dose{font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.4}

.divider{height:0.5px;background:var(--line);margin:14px 0}

table.s-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
table.s-table th{background:var(--surface);padding:7px 10px;text-align:left;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line)}
table.s-table td{padding:7px 10px;color:var(--ink2);border-bottom:0.5px solid var(--line);vertical-align:top;line-height:1.5}
table.s-table tr:last-child td{border-bottom:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-badge">🫀</div>
  <div>
    <div class="topbar-title">ACLS ალგორითმი</div>
    <div class="topbar-sub">ბოქსზე — სრული კლინიკური ინფო</div>
  </div>
</div>

<div class="scroll-wrap"><div class="svg-wrap">
<svg viewBox="0 0 680 1190" role="img">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ══ ROW 0 — პაციენტი ══ -->
<g class="node c-purple" onclick="S('patient')">
  <rect x="225" y="14" width="230" height="46" rx="10"/>
  <text class="th" x="340" y="32" text-anchor="middle" dominant-baseline="central">პაციენტი / Scene</text>
  <text class="ts" x="340" y="50" text-anchor="middle" dominant-baseline="central">Scene safe · PPE · ABCDE · 10 წმ</text>
</g>
<line x1="340" y1="60" x2="340" y2="96" stroke="#5B4FD9" stroke-width="1.5" marker-end="url(#ar)"/>

<!-- ══ ROW 1 — Pulse diamond + CA + HR ══ -->
<g onclick="S('pulse')" style="cursor:pointer">
  <polygon points="340,96 428,130 340,164 252,130" fill="#FFF8EC" stroke="#C07000" stroke-width="1.2"/>
  <text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central" fill="#5C3400">პულსი?</text>
  <text class="ts" x="340" y="143" text-anchor="middle" dominant-baseline="central" fill="#7A4500">≤10 წმ · carotid</text>
</g>

<!-- NO → CA -->
<line x1="252" y1="130" x2="148" y2="130" stroke="#D93025" stroke-width="2" marker-end="url(#ar)"/>
<text class="tl" x="198" y="120" text-anchor="middle" fill="#6B1511">არა / ეჭვი</text>

<!-- YES → HR -->
<line x1="428" y1="130" x2="526" y2="130" stroke="#0B7B5E" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="tl" x="476" y="120" text-anchor="middle" fill="#064535">კი</text>

<!-- Cardiac Arrest -->
<g class="node c-red" onclick="S('ca')">
  <rect x="14" y="104" width="134" height="52" rx="10"/>
  <text class="th" x="81" y="122" text-anchor="middle" dominant-baseline="central">Cardiac Arrest</text>
  <text class="ts" x="81" y="140" text-anchor="middle" dominant-baseline="central">VF/pVT · PEA · Asys.</text>
</g>

<!-- HR diamond -->
<g onclick="S('hr')" style="cursor:pointer">
  <polygon points="590,96 652,130 590,164 528,130" fill="#EDFAF5" stroke="#0B7B5E" stroke-width="1.2"/>
  <text class="th" x="590" y="122" text-anchor="middle" dominant-baseline="central" fill="#064535">HR</text>
  <text class="ts" x="590" y="143" text-anchor="middle" dominant-baseline="central" fill="#0B7B5E">რამდენია?</text>
</g>

<!-- HR <50 → Bradycardia -->
<line x1="590" y1="164" x2="590" y2="204" stroke="#C07000" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="tl" x="612" y="188" fill="#7A4500">&lt;50</text>

<!-- HR >150 — far right bypass -->
<path d="M652 130 L670 130 L670 486 L554 486"
      fill="none" stroke="#D93025" stroke-width="2" stroke-dasharray="7 3" marker-end="url(#ar)"/>
<text class="tl" x="658" y="116" text-anchor="middle" fill="#6B1511">&gt;150</text>

<!-- ══ ROW 2 y=204 ══ -->
<!-- CA → H&T -->
<line x1="81" y1="156" x2="81" y2="204" stroke="#D93025" stroke-width="1.2" marker-end="url(#ar)"/>
<!-- CA dashed → Shockable -->
<path d="M148 116 L162 116 L162 232 L176 232" fill="none" stroke="#D93025" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<!-- CA dashed → Non-Shock -->
<path d="M148 144 L168 144 L168 252 L318 252" fill="none" stroke="#C07000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<!-- H's & T's -->
<g class="node c-slate" onclick="S('hnt')">
  <rect x="14" y="204" width="134" height="62" rx="10"/>
  <text class="th" x="81" y="222" text-anchor="middle" dominant-baseline="central">H's &amp; T's</text>
  <text class="ts" x="81" y="240" text-anchor="middle" dominant-baseline="central">10 შექცევადი</text>
  <text class="ts" x="81" y="256" text-anchor="middle" dominant-baseline="central">მიზეზი</text>
</g>

<!-- Shockable -->
<g class="node c-red" onclick="S('shock')">
  <rect x="176" y="204" width="130" height="62" rx="10"/>
  <text class="th" x="241" y="222" text-anchor="middle" dominant-baseline="central">Shockable</text>
  <text class="ts" x="241" y="240" text-anchor="middle" dominant-baseline="central">VF / pVT</text>
  <text class="ts" x="241" y="256" text-anchor="middle" dominant-baseline="central">შოკი 120–200J</text>
</g>

<!-- Non-Shockable -->
<g class="node c-amber" onclick="S('nonshock')">
  <rect x="318" y="204" width="138" height="62" rx="10"/>
  <text class="th" x="387" y="222" text-anchor="middle" dominant-baseline="central">Non-Shockable</text>
  <text class="ts" x="387" y="240" text-anchor="middle" dominant-baseline="central">PEA · Asystole</text>
  <text class="ts" x="387" y="256" text-anchor="middle" dominant-baseline="central">ეპი 1mg ASAP</text>
</g>

<!-- Bradycardia -->
<g class="node c-amber" onclick="S('brady')">
  <rect x="472" y="204" width="170" height="62" rx="10"/>
  <text class="th" x="557" y="222" text-anchor="middle" dominant-baseline="central">Bradycardia</text>
  <text class="ts" x="557" y="240" text-anchor="middle" dominant-baseline="central">HR &lt;50 / min</text>
  <text class="ts" x="557" y="256" text-anchor="middle" dominant-baseline="central">სიმპტომები?</text>
</g>

<!-- ══ ROW 3 y=330 — CPR + TCP ══ -->
<line x1="81"  y1="266" x2="81"  y2="328" stroke="#546E7A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<line x1="241" y1="266" x2="241" y2="328" stroke="#D93025" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="387" y1="266" x2="387" y2="328" stroke="#C07000" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="557" y1="266" x2="557" y2="328" stroke="#C07000" stroke-width="1.5" marker-end="url(#ar)"/>

<g class="node c-red" onclick="S('cpr')">
  <rect x="14" y="328" width="440" height="74" rx="10"/>
  <text class="th" x="234" y="348" text-anchor="middle" dominant-baseline="central">CPR — 2-წუთიანი ციკლი</text>
  <text class="ts" x="234" y="368" text-anchor="middle" dominant-baseline="central">100–120/წთ · ≥5სმ · CCF ≥80% · Full recoil · Pause ≤10წმ</text>
  <text class="ts" x="234" y="386" text-anchor="middle" dominant-baseline="central">VF: შოკი→ეპი(2შ)→ამიოდ.300(3შ)→150mg · PEA: ეპი 1mg ASAP</text>
</g>

<g class="node c-amber" onclick="S('tcp')">
  <rect x="472" y="328" width="170" height="74" rx="10"/>
  <text class="th" x="557" y="348" text-anchor="middle" dominant-baseline="central">TCP / TVP</text>
  <text class="ts" x="557" y="368" text-anchor="middle" dominant-baseline="central">ატრ. → TCP → TVP</text>
  <text class="ts" x="557" y="386" text-anchor="middle" dominant-baseline="central">Mobitz II / 3° → TVP!</text>
</g>

<!-- ══ ROW 4 y=468 — Tachycardia (arrived from right) ══ -->
<g class="node c-red" onclick="S('tachy')">
  <rect x="310" y="464" width="244" height="56" rx="10"/>
  <text class="th" x="432" y="483" text-anchor="middle" dominant-baseline="central">Tachycardia</text>
  <text class="ts" x="432" y="501" text-anchor="middle" dominant-baseline="central">HR &gt;150/min · Stable თუ Unstable?</text>
</g>

<!-- ══ ROW 5 y=592 — Cardioversion + QRS ══ -->
<!-- Unstable → left -->
<path d="M310 492 L238 492 L238 592 L14 592"
      fill="none" stroke="#D93025" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tl" x="165" y="583" text-anchor="middle" fill="#6B1511">Unstable</text>
<!-- Stable → down -->
<line x1="432" y1="520" x2="432" y2="592" stroke="#0B7B5E" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tl" x="453" y="562" fill="#064535">Stable</text>

<g class="node c-teal" onclick="S('cardio')">
  <rect x="14" y="592" width="268" height="64" rx="10"/>
  <text class="th" x="148" y="612" text-anchor="middle" dominant-baseline="central">⚡ Cardioversion</text>
  <text class="ts" x="148" y="630" text-anchor="middle" dominant-baseline="central">Sync — AFib · SVT · Mono VT</text>
  <text class="ts" x="148" y="647" text-anchor="middle" dominant-baseline="central">Unsync — VF · pVT · Poly VT</text>
</g>

<g class="node c-teal" onclick="S('qrs')">
  <rect x="300" y="592" width="362" height="64" rx="10"/>
  <text class="th" x="481" y="612" text-anchor="middle" dominant-baseline="central">Narrow / Wide QRS</text>
  <text class="ts" x="481" y="630" text-anchor="middle" dominant-baseline="central">&lt;120ms → SVT · ≥120ms → VT</text>
  <text class="ts" x="481" y="647" text-anchor="middle" dominant-baseline="central">Regular vs Irregular → Adenosine / Amio</text>
</g>

<!-- ══ ROW 6 y=724 — SVT + VT ══ -->
<line x1="375" y1="656" x2="175" y2="724" stroke="#0B7B5E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="585" y1="656" x2="502" y2="724" stroke="#D93025" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<g class="node c-teal" onclick="S('svt')">
  <rect x="14" y="724" width="308" height="64" rx="10"/>
  <text class="th" x="168" y="744" text-anchor="middle" dominant-baseline="central">Narrow QRS — SVT</text>
  <text class="ts" x="168" y="762" text-anchor="middle" dominant-baseline="central">Vagal → Adenosine</text>
  <text class="ts" x="168" y="779" text-anchor="middle" dominant-baseline="central">6mg → 12mg → 12mg IV push</text>
</g>

<g class="node c-red" onclick="S('vt')">
  <rect x="340" y="724" width="322" height="64" rx="10"/>
  <text class="th" x="501" y="744" text-anchor="middle" dominant-baseline="central">Wide QRS — VT</text>
  <text class="ts" x="501" y="762" text-anchor="middle" dominant-baseline="central">Amiodarone 150mg / 10 წთ</text>
  <text class="ts" x="501" y="779" text-anchor="middle" dominant-baseline="central">Unstable → Cardioversion!</text>
</g>

<!-- ══ ROW 7 y=858 — ROSC ══ -->
<line x1="81"  y1="402" x2="81"  y2="858" stroke="#0B7B5E" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="tl" x="64" y="630" fill="#0B7B5E" text-anchor="middle">ROSC?</text>
<line x1="168" y1="788" x2="168" y2="858" stroke="#0B7B5E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="501" y1="788" x2="501" y2="858" stroke="#0B7B5E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  html: `

  <div class="s-label">განმარტება</div>
  <div class="s-box"><p>SVT = Supraventricular Tachycardia<br>
  ხშ. AVNRT (AV nodal re-entry) = "P buried in QRS" ან retrograde P<br>
  HR ჩვ. 150–250/წთ · Narrow QRS · Regular<br>
  <strong>გამ.:</strong> Parox. onset/offset · Palpitation · Presyncope</p></div>
</div>
<div class="s-section">
  <div class="s-label">Step 1 — Vagal Maneuver</div>
  <div class="s-box" style="border-left:3px solid var(--teal)">
    <p><strong>Modified Valsalva (საუკ.):</strong> 15წმ blow → სუპინ + legs↑ 45° → 1წთ<br>
    <strong>Carotid Sinus Massage:</strong> ყელი 5–10წმ<br>
    CI: Bruit · Stroke Hx · TIA Hx<br>
    <strong>Cold water face immersion:</strong> ბავშვებში ეფ.</p>
  </div>
</div>
<div class="s-section">
  <div class="s-label">Step 2 — Adenosine</div>
  <ul class="s-steps">
    <li class="step-teal"><span class="num">1</span><span><strong>6mg rapid IV push</strong> — antecubital ან ზემო + 20ml flush + arm↑<br>Monitor (12-lead) + Crash cart მახლ.!<br>T½ = 10 წამი — სწრაფად!</span></li>
    <li class="step-teal"><span class="num">2</span><span><strong>12mg</strong> — თუ 6mg ვ.შ. (1–2წთ)</span></li>
    <li class="step-teal"><span class="num">3</span><span><strong>12mg</strong> — კვლ. თუ საჭ. (max 3 dose)</span></li>
  </ul>
</div>
<div class="s-section">
  <div class="s-label">Adenosine — სპეც. სიტუ.</div>
  <table class="s-table">
    <tr><th>სიტ.</th><th>ცვლ.</th></tr>
    <tr><td>Theophylline / Caffeine</td><td>↑ დოზა (12mg პირველი)</td></tr>
    <tr><td>Dipyridamole / Carbamazepine</td><td>3mg-ით!</td></tr>
    <tr><td>Asthma / COPD</td><td><span class="badge badge-red">კონტ.!</span> ბრონქოსპ.</td></tr>
    <tr><td>Central line</td><td>3mg (ეფ. ↑↑)</td></tr>
    <tr><td>WPW + AFib</td><td><span class="badge badge-red">სიკვდ.!</span> Cardioversion only!</td></tr>
    <tr><td>Transplant heart</td><td>1mg-ით (hypersensitive)</td></tr>
  </table>
</div>
<div class="s-section">
  <div class="s-label">AFib / A-Flutter — Stable</div>
  <div class="s-box">
    <div class="drug-row"><span class="drug-name">Rate control</span><span class="drug-dose">Metoprolol 5mg IV · Diltiazem 15–20mg</span></div>
    <div class="drug-row"><span class="drug-name">A-Flutter</span><span class="drug-dose">Cardioversion 50–100J (Drug-res.)</span></div>
    <div class="drug-row"><span class="drug-name">Anticoagulation</span><span class="drug-dose">≥48სთ AFib → Heparin + CHA₂DS₂</span></div>
  </div>
</div>`
},

vt: {
  title: "🔴 Wide QRS — VT",
  html: `
<div class="s-section">
  <div class="danger"><strong>VT პრეზ. პრინციპი:</strong> Wide regular tach = VT სანამ სხვა არ დამ. — ყ. Amiodarone.</div>
</div>
<div class="s-section">
  <div class="s-label">Stable Mono VT</div>
  <div class="s-box">
    <div class="drug-row"><span class="drug-name">Amiodarone</span><span class="drug-dose">150mg/10წთ IV slow → 1mg/min 6სთ → 0.5mg/min 18სთ</span></div>
    <div class="drug-row"><span class="drug-name">Procainamide</span><span class="drug-dose">20–50mg/min · max 17mg/kg · CI: EF&lt;40%</span></div>
    <div class="drug-row"><span class="drug-name">Sotalol</span><span class="drug-dose">100mg/10წთ IV · CI: QT↑ / Torsades</span></div>
    <div class="drug-row"><span class="drug-name">Lidocaine</span><span class="drug-dose">1–1.5mg/kg IV · ალტ. Amio-ს</span></div>
  </div>
</div>
<div class="s-section">
  <div class="s-label">Unstable VT</div>
  <div class="danger"><strong>→ Synchronized Cardioversion მაშინვე!</strong><br>
  სედ.: Midazolam + Fentanyl (თუ გონება შენ.)</div>
</div>
<div class="s-section">
  <div class="s-label">Torsades de Pointes — ✗ Amio!</div>
  <div class="s-box" style="border-left:3px solid var(--red)">
    <p><strong>განმ.:</strong> QT↑ + Polymorphic VT (twisting QRS)<br>
    <strong>მიზეზი:</strong> Amio, Sotalol, Haloperidol, HypoMg/K, Congenital<br>
    <span class="badge badge-red">Amiodarone = კატ. კონტ.!</span> QT↑↑ → VF!<br><br>
    <strong>მკ.:</strong><br>
    → Mg 1–2g IV slow 5–10წთ<br>
    → Overdrive pacing (HR→100 → QT↓)<br>
    → Isoproterenol 2–10mcg/min<br>

    → Unstable → Unsync Defib</p>
  </div>
</div>
<div class="s-section">
  <div class="s-label">AFib + WPW — Wide Irregular</div>
  <div class="danger"><strong>→ Cardioversion ONLY!</strong><br>
  Adenosine/Verapamil/Digoxin → AV block → Kent↑ → VF!<br>
  Procainamide ან Ibutilide (stable, თუ გადაწ.)</div>
</div>`
},

rosc: {
  title: "🟢 ROSC — Return of Spontaneous Circulation",
  html: `
<div class="s-section">
  <div class="ok"><strong>ახლა ტვინი:</strong> ROSC = გულსისხლ-სისხ. ↑ → ახლა ტვინი ვ. · Secondary injury avoid.</div>
</div>
<div class="s-section">
  <div class="s-label">სამიზნეები — ყველა ერთად</div>
  <div class="s-grid">
    <div class="s-card"><div class="s-card-label">SpO₂</div><div class="s-card-val">92–98%</div><div class="s-card-sub">&gt;98% = hyperoxia → ROS↑</div></div>
    <div class="s-card"><div class="s-card-label">PaCO₂</div><div class="s-card-val">35–45mmHg</div><div class="s-card-sub">Hypervent. → CBF↓</div></div>
    <div class="s-card"><div class="s-card-label">SBP</div><div class="s-card-val">≥90</div><div class="s-card-sub">MAP ≥65 target</div></div>
    <div class="s-card"><div class="s-card-label">TTM</div><div class="s-card-val">32–36°C</div><div class="s-card-sub">24–48სთ კომა-პ.</div></div>
    <div class="s-card"><div class="s-card-label">Glucose</div><div class="s-card-val">140–180</div><div class="s-card-sub">ჰიპოგლიკ. = კრიტ.!</div></div>
    <div class="s-card"><div class="s-card-label">ETCO₂</div><div class="s-card-val">35–45</div><div class="s-card-sub">↑ ვენტ. თუ &gt;45</div></div>
  </div>
</div>
<div class="s-section">
  <div class="s-label">Vasopressors (SBP &lt;90)</div>
  <div class="s-box">
    <div class="drug-row"><span class="drug-name">Norepinephrine</span><span class="drug-dose">0.1–0.5 mcg/kg/min (1st choice)</span></div>
    <div class="drug-row"><span class="drug-name">Epinephrine</span><span class="drug-dose">0.1–0.5 mcg/kg/min</span></div>
    <div class="drug-row"><span class="drug-name">Dopamine</span><span class="drug-dose">5–10 mcg/kg/min (ალტ.)</span></div>
    <div class="drug-row"><span class="drug-name">Fluids</span><span class="drug-dose">250ml bolus თუ ჰიპოვ. · avoid fluid overload</span></div>
  </div>
</div>
<div class="s-section">
  <div class="s-label">გამ. სტაბ. შემდ. — პრიორ.</div>
  <ul class="s-steps">
    <li class="step-green"><span class="num">1</span><span><strong>12-lead ECG</strong> — STEMI? → Cath Lab ≤24სთ (ნებ. rhythm)</span></li>
    <li class="step-green"><span class="num">2</span><span><strong>CT Head</strong> — თუ non-cardiac მიზეზი (ინს., ტრ.)</span></li>
    <li class="step-green"><span class="num">3</span><span><strong>TTM 32–36°C</strong> — 24–48სთ · ცხ. avoid ≥72სთ</span></li>
    <li class="step-green"><span class="num">4</span><span><strong>Neuro monitoring</strong> — EEG (seizure?), SSEP, CT/MRI 72სთ</span></li>
    <li class="step-green"><span class="num">5</span><span><strong>Prognostication</strong> — ≥72სთ პოსტ-ROSC (ადრეული ✗)</span></li>
  </ul>
</div>
<div class="s-section">
  <div class="s-label">TTM — Targeted Temperature Management</div>
  <div class="s-box"><p><strong>კანდ.:</strong> კომა post-ROSC (GCS &lt;8) · შ-ი Cardiac arrest<br>
  <strong>მეთ.:</strong> Cold IV fluids (30ml/kg) + Surface cooling ან Endovascular<br>
  <strong>32–34°C</strong> = ნეირო-პრ. · <strong>36°C</strong> = Fever avoid (equiv.)<br>
  <strong>Shivering:</strong> Mg 2g + Meperidine + Sedation<br>
  <strong>Rewarming:</strong> 0.25°C/სთ · ≥48სთ ნ. 37°C-მდე</p></div>
</div>
<div class="s-section">
  <div class="s-label">⚠️ Avoid</div>
  <div class="danger"><strong>Hyperoxia</strong> (SpO₂ &gt;98%) → ROS → ↑ mortality<br>
  <strong>Hypocapnia</strong> (PaCO₂ &lt;35) → vasoconstr → CBF↓<br>
  <strong>Hypoglycemia</strong> → ≥140 maintain<br>
  <strong>Fever</strong> ≥37.7°C → ↑ cerebral metabol. demand<br>
  <strong>ადრ. prognostication</strong> &lt;72სთ → misleading</div>
</div>`
}

};

function S(key) {
  const d = DATA[key];
  if (!d) return;
  document.getElementById('sh-title').textContent = d.title;
  document.getElementById('sh-body').innerHTML = d.html;
  document.getElementById('sh-body').scrollTop = 0;
  document.getElementById('bd').classList.add('open');
  document.getElementById('sh').classList.add('open');
}
function closeSheet() {
  document.getElementById('bd').classList.remove('open');
  document.getElementById('sh').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

let _sy = 0;
const sh = document.getElementById('sh');
sh.addEventListener('touchstart', e => { _sy = e.touches[0].clientY; }, {passive:true});
sh.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - _sy > 90) closeSheet();
}, {passive:true});
</script>
